name: Verify interface localization

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/build-web.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/i18n-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/build-web.mjs
      - name: Browser test dependencies
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Test language selector in browser
        run: |
          (python3 -m http.server 4173 --bind 127.0.0.1 --directory www > /tmp/i18n-preview.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node tests/i18n-smoke.mjs http://127.0.0.1:4173/
