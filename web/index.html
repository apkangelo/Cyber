<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#130d1f">
  <title>Cyber</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="btn-menu" class="icon-btn" type="button" title="Connexions" aria-label="Connexions"></button>
      <div id="tabs" role="tablist"></div>
      <button id="btn-new" class="icon-btn" type="button" title="Nouvel onglet (Ctrl+Maj+T)" aria-label="Nouvel onglet"></button>
      <button id="btn-snippets" class="icon-btn" type="button" title="Commandes rapides" aria-label="Commandes rapides"></button>
      <button id="btn-settings" class="icon-btn" type="button" title="Réglages (Ctrl+,)" aria-label="Réglages"></button>
    </header>
    <div id="main">
      <aside id="sidebar" aria-label="Connexions"></aside>
      <div id="sidebar-backdrop"></div>
      <section id="terminals">
        <div id="empty-state" hidden></div>
        <div id="searchbar" hidden></div>
      </section>
    </div>
    <nav id="extra-keys" aria-label="Touches supplémentaires"></nav>
  </div>
  <div id="layers"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-web-links.js"></script>
  <script src="vendor/addon-search.js"></script>
  <script src="vendor/addon-unicode11.js"></script>
  <script src="vendor/addon-webgl.js"></script>
  <script src="js/util.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/store.js"></script>
  <script src="js/keygen.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/keys.js"></script>
  <script src="js/session.js"></script>
  <script src="js/connections-ui.js"></script>
  <script src="js/settings-ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
